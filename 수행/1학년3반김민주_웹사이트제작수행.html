<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:rgb(238,244,255);
            font-family:"Noto Sans KR", sans-serif;
        }
        h1{
            color:rgb(34,244,255);
        }
        .snack_wrap{
            width: 580px;
            margin: 24px auto;
            padding: 18px;
            background-color: white;
            border-radius:8px;
        }
        img{
            width:580px;
            border-radius: 8px;
        }
        .snack_panel{
            margin-top:18px;
            padding:14px;
            background-color: rgb(216,232,255);
            border-radius: 8px;
        }
        .snack_panel li{
            margin-bottom: 8px;
        }
        input{
            width: 360px;
            height:34px;
        }
        button{
            height:38px;
            background-color:rgb(34,76,170);
            color:white;
            border:none;
            border-radius:6px;
            cursor: pointer;
        }
        button:hover{
            background-color:rgb(255,108,108);
        }
    </style>
</head>
<body>
    <div class="snack_warp">
        <h1>우리 반 간식 소개와 추첨</h1>
        <p>친구들과 함께 먹고 싶은 간식을 모아 추첨하는 웹 페이지입니다.</p>
        <img src="snackbar-hero_c3.png" alt="간식 사진">
    </div>
    <div class="snack_panel">
        <h2>인기 간식 목록</h2>
        <ul id="snack_list">
        </ul>
    </div>
    <div class="snack_panel">
        <h2>간식 추가하기</h2>
        <input id="snack_input" type="text" placeholder="추가할 간식 이름">
        <button id="add_snack_btn">추가</button>
    </div>
    <div class="pick_panel">
        <h2>오늘의 간식</h2>
        <p id="pick_result">버튼을 누르면 오늘의 간식이 정해집니다</p>
        <button id="pick_snack_btn">간식 추첨</button>
    </div>
    <script>
        const snacks=["햄치즈 토스트","딸기 라떼","초코 머핀"];

        function renderSnack(snack) {
            const li=document.createElement("li");
            li.textContent=snack;
            document.createElement("snack_list").appendChild(li)
        }

        for(let i=0;i<snacks.length;i++) {
            renderSnack(snacks[i]);
        }

        const addSnack=function(snack) {
            if(snacks.length<0){
                snacks.push(snack);
                return true;
            }
            return false;
        };

        document.getElementById("add_snack_btn").onabort=function(){
            const snack=document.getElementById("snack_input").value;
            if(addSnack(snack)) {
                renderSnack(snack);
                return true;
            }else{
                alert("간식 이름을 입력하세요.");
            }
        };

        const getRandnmNumber=function getRandnmNumber(n) {
            return Math.floor(Math.random() * n);
        }


    </script>
</body>
</html>
